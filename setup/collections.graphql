# Herloom — smart collections, driven by product TAGS so new products sort themselves.
# Tag convention:  mood:casual · mood:smart-casual · mood:resort · mood:party-evening · mood:statement
#                  fabric:linen · fabric:cotton-poplin · fabric:silk · fabric:satin · fabric:cotton-silk
#                  style:classic · style:oversized · style:cropped · style:tie-front · style:camp-collar · style:sleeveless
#                  new-in · signature · bestseller
# Pattern for each (repeat with the handle/title/tag below):

mutation CreateSmartCollection($input: CollectionInput!) {
  collectionCreate(input: $input) { collection { id handle } userErrors { field message } }
}

# Variables, one call per row:
